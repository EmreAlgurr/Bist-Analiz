server.port=8080
spring.application.name=bist-analiz
spring.jackson.serialization.indent-output=true

# ── SQLite Veritabanı Ayarları ──
spring.datasource.url=jdbc:sqlite:bist_data.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── Hibernate / JPA Ayarları ──
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Finansal Varsayımlar ──
risk.free.rate=0.40

# ── Strateji Filtre Ayarları ──
strategy.min.volume=1000000

# ── TCMB EVDS API (Gerçek Enflasyon Verisi) ──
# API anahtarı almak için: https://evds2.tcmb.gov.tr/ → Kayıt Ol → Profilim → API Anahtarı
# Anahtarı aldıktan sonra aşağıdaki satırı doldurun:
tcmb.evds.api.key=gIgYAa9OtG
